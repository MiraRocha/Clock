<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analog Clock htmk css and javascript</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="clock">
        <div class="content">
            <div class="hour"></div>
            <div class="minute"></div>
            <div class="second"></div>
            <div class="num1">12</div>
            <div class="num2">3</div>
            <div class="num3">6</div>
            <div class="num4">9</div>

        </div>
    </div>
    <script>
        const x = document.querySelector(".hour");
        const y = document.querySelector(".minute");
        const z = document.querySelector(".second");

        function setDate() {
            const now = new Date()

            const hours = now.getHours()
            const A = (hours / 12) * 360 + 90;
            x.style.transform = `rotate(${A}deg)`;


            const minutes = now.getMinutes()
            const B = (minutes / 60) * 360 + 90;
            y.style.transform = `rotate(${B}deg)`;


            const seconds = now.getSeconds()
            const C = (seconds / 60) * 360 + 90;
            z.style.transform = `rotate(${C}deg)`;
        }

        setInterval(setDate, 1000);
        setDate();
    </script>
</body>
</html>
